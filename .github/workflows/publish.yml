name: Publish
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: node tooling/package/release-guard.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:ranks && pnpm prepare:assets && pnpm generate:tables
      - run: git diff --exit-code -- packages/assets/generated packages/assets/outlined packages/assets/src/generated packages/react/src/table-skins.generated.ts
      - run: pnpm check
      - run: pnpm test:visual
      - run: pnpm package:release
      - run: pnpm test:consumers
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - run: npm publish ./dist/package --access public --ignore-scripts --registry=https://registry.npmjs.org/
